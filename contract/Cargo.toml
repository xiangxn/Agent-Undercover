[package]
name = "agent-undercover-contract"
version = "0.1.0"
edition = "2021"
description = "Escrow + social deduction game contract for Agent Undercover"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
