[package]
name = "agent-undercover-wallet"
version = "0.1.0"
edition = "2021"
description = "Minimal stake-only wallet for an Agent Undercover agent account"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
borsh = "1.8"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
